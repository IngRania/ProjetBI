<div class="login-page"
     style="background-image: url('assets/login-bg.jpg'), linear-gradient(135deg, #0E3B2B 0%, #16803C 55%, #F5C518 100%);">
  <div class="veil" aria-hidden="true"></div>

  <main class="card-wrap">
    <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <h1>Connexion</h1>

      @if (error(); as msg) {
        <div class="alert alert-error" role="alert">{{ msg }}</div>
      }

      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" class="input" formControlName="email" autocomplete="username"
               [class.invalid]="invalid('email')" [attr.aria-invalid]="invalid('email')" />
      </div>

      <div class="field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" class="input" formControlName="password" autocomplete="current-password"
               [class.invalid]="invalid('password')" [attr.aria-invalid]="invalid('password')" />
      </div>

      <button type="submit" class="btn btn-primary submit" [disabled]="loading()">
        {{ loading() ? 'Connexion…' : 'Se connecter' }}
      </button>

      <div class="demo" role="group" aria-label="Remplir avec un compte de démonstration">
        @for (a of demoAccounts; track a.email) {
          <button type="button" class="btn btn-outline btn-sm" (click)="fill(a)">{{ a.label }}</button>
        }
      </div>
    </form>
  </main>
</div>
