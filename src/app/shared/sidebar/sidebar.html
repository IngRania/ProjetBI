<nav id="app-sidebar" class="sidebar" [class.open]="open()" aria-label="Menu principal">
  <ul>
    @for (item of items(); track item.path) {
      <li>
        <a [routerLink]="item.path" routerLinkActive="active" ariaCurrentWhenActive="page" (click)="navigate.emit()">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            @switch (item.icon) {
              @case ('chart') { <path d="M4 20V10M10 20V4M16 20v-7M22 20H2" /> }
              @case ('gym') { <path d="M3 9v6M6 7v10M18 7v10M21 9v6M6 12h12" /> }
              @case ('users') { <path d="M16 20v-1a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v1M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M22 20v-1a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8" /> }
              @case ('doc') { <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6M8 13h8M8 17h5" /> }
            }
          </svg>
          <span>{{ item.label }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
